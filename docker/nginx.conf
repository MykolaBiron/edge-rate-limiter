worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;
    keepalive_requests 100000;

    # Docker's embedded DNS, re-read every few seconds by `resolve` below. In practice
    # Docker DNS occasionally answers SERVFAIL and nginx keeps the old address set, so
    # restart nginx after changing the replica count (see README).
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream gateways {
        zone gateways 64k;
        least_conn;
        # The default (max_fails=1, fail_timeout=10s) ejects a replica for 10s after a
        # single slow connect, which under load cascades onto the remaining replicas.
        server gateway:8000 resolve max_fails=5 fail_timeout=2s;
        keepalive 1024;
        # Must be below uvicorn's --timeout-keep-alive (30s), or nginx reuses
        # connections uvicorn is closing and gets "connection reset by peer".
        keepalive_timeout 20s;
    }

    server {
        listen 8080 reuseport backlog=4096;

        # Metrics are scraped directly from each replica, never through the edge.
        location = /_gw/metrics {
            return 404;
        }

        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Demo only: this nginx plays the CDN edge, so client-sent geo headers
            # pass through. Behind a real CDN, only accept them from its IP ranges.
            proxy_next_upstream error timeout http_502;
            proxy_connect_timeout 1s;
        }
    }
}
